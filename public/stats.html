<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Lexora — Stats</title>
<style>
  :root{
    --indigo:#1B2A4A; --indigo-deep:#0E1729; --indigo-soft:#2C3F63;
    --linen:#F4EDE4; --amber:#E4A853; --amber-glow:#F2C078; --sage:#5B8A72;
    --card:rgba(20,30,54,.55); --card-brd:rgba(244,237,228,.14);
    --ink:#F4EDE4; --ink-dim:rgba(244,237,228,.66);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:
      radial-gradient(60% 50% at 20% 0%, rgba(228,168,83,.14) 0%, transparent 60%),
      linear-gradient(180deg,var(--indigo) 0%, var(--indigo-deep) 100%);
    color:var(--ink); min-height:100vh; padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto}
  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  .brand{font-size:22px; font-weight:900; letter-spacing:.3px}
  .brand .dot{color:var(--amber)}
  .sub{color:var(--ink-dim); font-size:13px; margin:0 0 10px}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-left:auto}
  .btn{
    background:linear-gradient(180deg,var(--amber-glow),var(--amber));
    color:var(--indigo-deep); border:none; border-radius:999px;
    font-weight:800; font-size:13px; padding:8px 14px; cursor:pointer;
    box-shadow:0 6px 16px -6px rgba(228,168,83,.6);
  }
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--card-brd); box-shadow:none}
  .btn:active{transform:translateY(1px) scale(.98)}
  .pill{font-size:12px; color:var(--ink-dim); background:var(--card); border:1px solid var(--card-brd); padding:5px 10px; border-radius:999px}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:16px 0 4px}
  .card{background:var(--card); border:1px solid var(--card-brd); border-radius:16px; padding:14px 16px; backdrop-filter:blur(6px)}
  .card .k{font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:700}
  .card .v{font-size:28px; font-weight:900; margin-top:4px; font-variant-numeric:tabular-nums}
  .card.accent{background:linear-gradient(180deg,rgba(228,168,83,.22),rgba(228,168,83,.08)); border-color:rgba(228,168,83,.4)}

  section{margin-top:24px}
  h2{font-size:15px; font-weight:900; margin:0 0 10px; display:flex; align-items:center; gap:8px}
  h2 .tag{font-size:11px; font-weight:700; color:var(--ink-dim); background:var(--card); border:1px solid var(--card-brd); padding:2px 8px; border-radius:999px}
  .panel{background:var(--card); border:1px solid var(--card-brd); border-radius:16px; padding:14px; overflow:hidden; position:relative}

  table{width:100%; border-collapse:collapse; font-size:13px}
  thead th{background:var(--indigo-soft); color:var(--ink); text-align:left; padding:9px 12px; font-weight:800; white-space:nowrap; border-bottom:1px solid var(--card-brd)}
  tbody td{padding:8px 12px; border-bottom:1px solid rgba(244,237,228,.07)}
  tbody tr:hover{background:rgba(244,237,228,.05)}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .barcell{position:relative; min-width:120px}
  .barcell .bar{position:absolute; left:0; top:50%; transform:translateY(-50%); height:60%; border-radius:6px;
    background:linear-gradient(90deg,var(--amber),var(--amber-glow)); opacity:.55}
  .barcell span{position:relative; padding-left:8px; font-weight:700}
  .zero{color:var(--ink-dim)}

  canvas{width:100%; max-height:300px; display:block}
  #level-chart{cursor:crosshair}

  /* sparkline tooltip */
  .tip{
    position:absolute; pointer-events:none; z-index:5;
    background:rgba(14,23,41,.96); border:1px solid var(--card-brd);
    border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700;
    color:var(--ink); box-shadow:0 8px 20px rgba(0,0,0,.5);
    transform:translate(-50%,-120%); white-space:nowrap; opacity:0; transition:opacity .12s;
  }
  .tip .lvl{color:var(--amber-glow)}

  .err{background:rgba(217,112,91,.15); border:1px solid rgba(217,112,91,.5); color:#ffd9cf; padding:12px 14px; border-radius:12px; font-size:14px}
  .loading{color:var(--ink-dim); font-size:14px; padding:20px}
  details{margin-top:22px}
  summary{cursor:pointer; color:var(--ink-dim); font-size:13px}
  pre{background:var(--indigo-deep); border:1px solid var(--card-brd); border-radius:12px; padding:14px; overflow:auto; font-size:12px; max-height:340px}
  .foot{margin-top:26px; color:var(--ink-dim); font-size:12px; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Lexora <span class="dot">•</span> Stats</span>
    <div class="toolbar">
      <span id="updated" class="pill">—</span>
      <button id="refresh" class="btn">↻ Refresh</button>
      <button id="auto" class="btn ghost">Auto: off</button>
    </div>
  </header>
  <p class="sub">Your private player dashboard · live from D1.</p>

  <div id="status"></div>

  <!-- TOTALS -->
  <div id="totals" class="cards"></div>

  <!-- ACTIVE PLAYERS -->
  <section>
    <h2>Active Players <span class="tag">recency</span></h2>
    <div id="active" class="cards" style="margin-top:0"></div>
  </section>

  <!-- BY CHAPTER CHART -->
  <section>
    <h2>Players by Chapter <span class="tag" id="chapter-tag">progression</span></h2>
    <div class="panel"><canvas id="chart" height="300"></canvas></div>
  </section>

  <!-- BY LEVEL SPARKLINE (interactive) -->
  <section>
    <h2>Players by Level <span class="tag" id="level-tag">granular</span></h2>
    <div class="panel">
      <canvas id="level-chart" height="220"></canvas>
      <div id="level-tip" class="tip"></div>
    </div>
  </section>

  <!-- BY CHAPTER TABLE -->
  <section>
    <h2>Chapter Breakdown <span class="tag" id="rows-tag">—</span></h2>
    <div class="panel"><table id="chapter-table">
      <thead><tr><th>Chapter</th><th>Levels</th><th class="num">Players</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <details>
    <summary>Raw JSON</summary>
    <pre id="raw">—</pre>
  </details>

  <p class="foot">Private admin view · not indexed · Lexora / WordHaus</p>
</div>

<script>
const ENDPOINT = "/api/stats";
const $ = (s)=>document.querySelector(s);
let autoTimer=null;
let LAST=null;                 // last payload, for redraws on resize
let levelSeries=[];            // dense 1..maxLevel series for the sparkline
let levelGeom=null;            // {padL,padT,ch,cw,xOf,yOf} for hit-testing

const fmt=(v)=> (typeof v==="number") ? v.toLocaleString() : String(v);

function card(k,v,accent){
  return `<div class="card${accent?' accent':''}"><div class="k">${k}</div><div class="v">${fmt(v)}</div></div>`;
}

function renderTotals(t){
  $("#totals").innerHTML =
    card("Total Players", t.players, true) +
    card("Top Score", t.topScore) +
    card("Avg Score", t.avgScore);
}

function renderActive(a){
  $("#active").innerHTML =
    card("Last 1 day", a.last1day) +
    card("Last 7 days", a.last7days) +
    card("Last 30 days", a.last30days);
}

function renderChapterTable(rows){
  $("#rows-tag").textContent = rows.length + " chapters";
  const max = Math.max(1, ...rows.map(r=>r.players));
  const body = rows.map(r=>{
    const pct = (r.players/max)*100;
    const cls = r.players===0 ? "zero" : "";
    return `<tr>
      <td>${r.chapter}</td>
      <td class="${cls}">${r.range}</td>
      <td class="num barcell">
        <span class="bar" style="width:${pct}%"></span>
        <span class="${cls}">${r.players}</span>
      </td>
    </tr>`;
  }).join("");
  $("#chapter-table tbody").innerHTML = body;
}

function drawChart(rows){
  const canvas = $("#chart");
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = 300;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const padL=36,padR=12,padT=14,padB=64;
  const cw=W-padL-padR, ch=H-padT-padB;
  const max=Math.max(1,...rows.map(r=>r.players));
  ctx.strokeStyle="rgba(244,237,228,.12)"; ctx.fillStyle="rgba(244,237,228,.6)";
  ctx.font="11px system-ui"; ctx.textAlign="right";
  for(let i=0;i<=4;i++){
    const y=padT+ch*(i/4); const val=Math.round(max*(1-i/4));
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(val,padL-6,y+3);
  }
  const n=rows.length, gap=8, bw=Math.max(6,(cw-gap*(n-1))/n);
  rows.forEach((r,i)=>{
    const x=padL+i*(bw+gap), h=ch*(r.players/max), y=padT+ch-h;
    if(r.players>0){
      const g=ctx.createLinearGradient(0,y,0,y+h);
      g.addColorStop(0,"#F2C078"); g.addColorStop(1,"#E4A853");
      ctx.fillStyle=g;
    } else { ctx.fillStyle="rgba(244,237,228,.10)"; }
    ctx.beginPath();
    const rr=Math.min(5,bw/2);
    ctx.roundRect(x,y,bw,Math.max(h,2),[rr,rr,0,0]); ctx.fill();
    if(r.players>0){ ctx.fillStyle="rgba(244,237,228,.9)";
      ctx.textAlign="center"; ctx.fillText(r.players,x+bw/2,y-4); }
    ctx.fillStyle="rgba(244,237,228,.6)"; ctx.textAlign="center";
    ctx.save(); ctx.translate(x+bw/2,H-padB+14); ctx.rotate(-Math.PI/5);
    ctx.fillText(r.chapter,0,0); ctx.restore();
  });
}

/* ---------- interactive per-level sparkline ---------- */
function drawLevelChart(rows, hoverIdx){
  const canvas = $("#level-chart");
  if(!canvas || !rows || !rows.length) return;
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = 220;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const padL=32,padR=12,padT=14,padB=28;
  const cw=W-padL-padR, ch=H-padT-padB;

  // dense 1..maxLevel so zero-player levels dip to baseline
  const maxLevel = Math.max(...rows.map(r=>r.level), 1);
  const map = new Map(rows.map(r=>[r.level, r.players]));
  levelSeries = [];
  for(let lv=1; lv<=maxLevel; lv++) levelSeries.push({ level:lv, players: map.get(lv)||0 });
  const maxP = Math.max(1, ...levelSeries.map(s=>s.players));

  const yTicks = Math.min(4, maxP);
  ctx.strokeStyle="rgba(244,237,228,.12)"; ctx.fillStyle="rgba(244,237,228,.6)";
  ctx.font="11px system-ui"; ctx.textAlign="right";
  for(let i=0;i<=yTicks;i++){
    const frac=i/yTicks;
    const y=padT+ch*(1-frac); const val=Math.round(maxP*frac);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(val,padL-6,y+3);
  }

  const xOf = (i)=> padL + (levelSeries.length===1 ? cw/2 : cw*(i/(levelSeries.length-1)));
  const yOf = (v)=> padT + ch*(1 - v/maxP);
  levelGeom = { padL, padT, ch, cw, xOf, yOf };

  // area fill
  ctx.beginPath();
  ctx.moveTo(xOf(0), padT+ch);
  levelSeries.forEach((s,i)=> ctx.lineTo(xOf(i), yOf(s.players)));
  ctx.lineTo(xOf(levelSeries.length-1), padT+ch); ctx.closePath();
  const grad = ctx.createLinearGradient(0,padT,0,padT+ch);
  grad.addColorStop(0,"rgba(242,192,120,.45)"); grad.addColorStop(1,"rgba(242,192,120,0)");
  ctx.fillStyle=grad; ctx.fill();

  // line
  ctx.beginPath();
  levelSeries.forEach((s,i)=> i? ctx.lineTo(xOf(i),yOf(s.players)) : ctx.moveTo(xOf(i),yOf(s.players)));
  ctx.strokeStyle="#E4A853"; ctx.lineWidth=2; ctx.stroke();

  // dots on non-zero levels
  ctx.fillStyle="#F2C078";
  levelSeries.forEach((s,i)=>{ if(s.players>0){ ctx.beginPath(); ctx.arc(xOf(i),yOf(s.players),3,0,Math.PI*2); ctx.fill(); } });

  // x labels (thinned)
  ctx.fillStyle="rgba(244,237,228,.6)"; ctx.textAlign="center";
  const step=Math.max(1,Math.ceil(levelSeries.length/12));
  levelSeries.forEach((s,i)=>{ if(i%step!==0 && i!==levelSeries.length-1) return;
    ctx.fillText("L"+s.level, xOf(i), H-8); });

  // hover crosshair + highlighted point
  if(hoverIdx!=null && levelSeries[hoverIdx]){
    const s=levelSeries[hoverIdx]; const hx=xOf(hoverIdx), hy=yOf(s.players);
    ctx.strokeStyle="rgba(244,237,228,.25)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(hx,padT); ctx.lineTo(hx,padT+ch); ctx.stroke();
    ctx.fillStyle="#FFFFFF"; ctx.beginPath(); ctx.arc(hx,hy,4.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#E4A853"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hx,hy,4.5,0,Math.PI*2); ctx.stroke();
  }

  $("#level-tag").textContent = `levels 1–${maxLevel}`;
}

function nearestLevelIndex(clientX){
  const canvas=$("#level-chart");
  const rect=canvas.getBoundingClientRect();
  const x=clientX-rect.left;
  if(!levelGeom || !levelSeries.length) return null;
  // invert xOf: i = (x-padL)/cw * (n-1)
  const n=levelSeries.length;
  let i = Math.round((x-levelGeom.padL)/levelGeom.cw*(n-1));
  i=Math.max(0,Math.min(n-1,i));
  return i;
}

function showLevelTip(clientX){
  const idx=nearestLevelIndex(clientX);
  if(idx==null){ hideLevelTip(); return; }
  const s=levelSeries[idx];
  const canvas=$("#level-chart"); const rect=canvas.getBoundingClientRect();
  const panelRect=canvas.parentElement.getBoundingClientRect();
  const px = rect.left - panelRect.left + levelGeom.xOf(idx);
  const py = rect.top  - panelRect.top  + levelGeom.yOf(s.players);
  const tip=$("#level-tip");
  tip.innerHTML = `<span class="lvl">Level ${s.level}</span> · ${s.players} player${s.players===1?"":"s"}`;
  tip.style.left = px+"px";
  tip.style.top  = py+"px";
  tip.style.opacity = "1";
  drawLevelChart(LAST.byLevel, idx);   // redraw with highlight
}
function hideLevelTip(){
  $("#level-tip").style.opacity="0";
  if(LAST && Array.isArray(LAST.byLevel)) drawLevelChart(LAST.byLevel, null);
}

function wireLevelInteractivity(){
  const canvas=$("#level-chart");
  canvas.addEventListener("mousemove", (e)=> showLevelTip(e.clientX));
  canvas.addEventListener("mouseleave", hideLevelTip);
  canvas.addEventListener("touchstart", (e)=>{ if(e.touches[0]) showLevelTip(e.touches[0].clientX); }, {passive:true});
  canvas.addEventListener("touchmove",  (e)=>{ if(e.touches[0]) showLevelTip(e.touches[0].clientX); }, {passive:true});
  canvas.addEventListener("touchend", hideLevelTip);
}

async function load(){
  $("#status").innerHTML = `<div class="loading">Loading…</div>`;
  try{
    const res = await fetch(ENDPOINT, { cache:"no-store", credentials:"include" });
    if(!res.ok){ $("#status").innerHTML = `<div class="err">Request failed: ${res.status} ${res.statusText}.</div>`; return; }
    const data = await res.json();
    LAST = data;
    $("#raw").textContent = JSON.stringify(data,null,2);
    $("#status").innerHTML = "";
    if(data.generatedAt){
      $("#updated").textContent = "Generated " + new Date(data.generatedAt).toLocaleString();
    }
    if(data.totals) renderTotals(data.totals);
    if(data.activePlayers) renderActive(data.activePlayers);
    if(Array.isArray(data.byChapter)){
      renderChapterTable(data.byChapter);
      requestAnimationFrame(()=>drawChart(data.byChapter));
    }
    if(Array.isArray(data.byLevel)){
      requestAnimationFrame(()=>drawLevelChart(data.byLevel, null));
    }
  }catch(err){
    $("#status").innerHTML = `<div class="err">Could not load stats: ${err.message}</div>`;
  }
}

$("#refresh").onclick = load;
$("#auto").onclick = function(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; this.textContent="Auto: off"; this.classList.add("ghost"); }
  else { autoTimer=setInterval(load,30000); this.textContent="Auto: 30s"; this.classList.remove("ghost"); }
};

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const rr=Array.isArray(r)?r:[r,r,r,r];
    this.beginPath(); this.moveTo(x+rr[0],y);
    this.arcTo(x+w,y,x+w,y+h,rr[1]); this.arcTo(x+w,y+h,x,y+h,rr[2]);
    this.arcTo(x,y+h,x,y,rr[3]); this.arcTo(x,y,x+w,y,rr[0]); this.closePath(); return this;
  };
}

window.addEventListener("resize", ()=>{
  if(!LAST) return;
  try{
    if(Array.isArray(LAST.byChapter)) drawChart(LAST.byChapter);
    if(Array.isArray(LAST.byLevel)) drawLevelChart(LAST.byLevel, null);
  }catch(e){}
});

wireLevelInteractivity();
load();
</script>
</body>
</html>
