<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Lexora — Stats</title>
<style>
  :root{
    --indigo:#1B2A4A; --indigo-deep:#0E1729; --indigo-soft:#2C3F63;
    --linen:#F4EDE4; --amber:#E4A853; --amber-glow:#F2C078; --sage:#5B8A72;
    --card:rgba(20,30,54,.55); --card-brd:rgba(244,237,228,.14);
    --ink:#F4EDE4; --ink-dim:rgba(244,237,228,.66);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:
      radial-gradient(60% 50% at 20% 0%, rgba(228,168,83,.14) 0%, transparent 60%),
      linear-gradient(180deg,var(--indigo) 0%, var(--indigo-deep) 100%);
    color:var(--ink); min-height:100vh; padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto}
  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  .brand{font-size:22px; font-weight:900; letter-spacing:.3px}
  .brand .dot{color:var(--amber)}
  .sub{color:var(--ink-dim); font-size:13px; margin:0 0 10px}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-left:auto}
  .btn{
    background:linear-gradient(180deg,var(--amber-glow),var(--amber));
    color:var(--indigo-deep); border:none; border-radius:999px;
    font-weight:800; font-size:13px; padding:8px 14px; cursor:pointer;
    box-shadow:0 6px 16px -6px rgba(228,168,83,.6);
  }
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--card-brd); box-shadow:none}
  .btn:active{transform:translateY(1px) scale(.98)}
  .pill{font-size:12px; color:var(--ink-dim); background:var(--card); border:1px solid var(--card-brd); padding:5px 10px; border-radius:999px}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:16px 0 4px}
  .card{background:var(--card); border:1px solid var(--card-brd); border-radius:16px; padding:14px 16px; backdrop-filter:blur(6px)}
  .card .k{font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:700}
  .card .v{font-size:28px; font-weight:900; margin-top:4px; font-variant-numeric:tabular-nums}
  .card.accent{background:linear-gradient(180deg,rgba(228,168,83,.22),rgba(228,168,83,.08)); border-color:rgba(228,168,83,.4)}

  section{margin-top:24px}
  h2{font-size:15px; font-weight:900; margin:0 0 10px; display:flex; align-items:center; gap:8px}
  h2 .tag{font-size:11px; font-weight:700; color:var(--ink-dim); background:var(--card); border:1px solid var(--card-brd); padding:2px 8px; border-radius:999px}
  .panel{background:var(--card); border:1px solid var(--card-brd); border-radius:16px; padding:14px; overflow:hidden}

  table{width:100%; border-collapse:collapse; font-size:13px}
  thead th{background:var(--indigo-soft); color:var(--ink); text-align:left; padding:9px 12px; font-weight:800; white-space:nowrap; border-bottom:1px solid var(--card-brd)}
  tbody td{padding:8px 12px; border-bottom:1px solid rgba(244,237,228,.07)}
  tbody tr:hover{background:rgba(244,237,228,.05)}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .barcell{position:relative; min-width:120px}
  .barcell .bar{position:absolute; left:0; top:50%; transform:translateY(-50%); height:60%; border-radius:6px;
    background:linear-gradient(90deg,var(--amber),var(--amber-glow)); opacity:.55}
  .barcell span{position:relative; padding-left:8px; font-weight:700}
  .zero{color:var(--ink-dim)}

  canvas{width:100%; max-height:300px}
  .err{background:rgba(217,112,91,.15); border:1px solid rgba(217,112,91,.5); color:#ffd9cf; padding:12px 14px; border-radius:12px; font-size:14px}
  .loading{color:var(--ink-dim); font-size:14px; padding:20px}
  details{margin-top:22px}
  summary{cursor:pointer; color:var(--ink-dim); font-size:13px}
  pre{background:var(--indigo-deep); border:1px solid var(--card-brd); border-radius:12px; padding:14px; overflow:auto; font-size:12px; max-height:340px}
  .foot{margin-top:26px; color:var(--ink-dim); font-size:12px; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Lexora <span class="dot">•</span> Stats</span>
    <div class="toolbar">
      <span id="updated" class="pill">—</span>
      <button id="refresh" class="btn">↻ Refresh</button>
      <button id="auto" class="btn ghost">Auto: off</button>
    </div>
  </header>
  <p class="sub">Your private player dashboard · live from D1.</p>

  <div id="status"></div>

  <!-- TOTALS -->
  <div id="totals" class="cards"></div>

  <!-- ACTIVE PLAYERS -->
  <section>
    <h2>Active Players <span class="tag">recency</span></h2>
    <div id="active" class="cards" style="margin-top:0"></div>
  </section>

  <!-- BY CHAPTER CHART -->
  <section>
    <h2>Players by Chapter <span class="tag" id="chapter-tag">progression</span></h2>
    <div class="panel"><canvas id="chart" height="300"></canvas></div>
  </section>

  <!-- BY CHAPTER TABLE -->
  <section>
    <h2>Chapter Breakdown <span class="tag" id="rows-tag">—</span></h2>
    <div class="panel"><table id="chapter-table">
      <thead><tr><th>Chapter</th><th>Levels</th><th class="num">Players</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <details>
    <summary>Raw JSON</summary>
    <pre id="raw">—</pre>
  </details>

  <p class="foot">Private admin view · not indexed · Lexora / WordHaus</p>
</div>

<script>
const ENDPOINT = "/api/stats";
const $ = (s)=>document.querySelector(s);
let autoTimer=null;

const fmt=(v)=> (typeof v==="number") ? v.toLocaleString() : String(v);

function card(k,v,accent){
  return `<div class="card${accent?' accent':''}"><div class="k">${k}</div><div class="v">${fmt(v)}</div></div>`;
}

function renderTotals(t){
  $("#totals").innerHTML =
    card("Total Players", t.players, true) +
    card("Top Score", t.topScore) +
    card("Avg Score", t.avgScore);
}

function renderActive(a){
  $("#active").innerHTML =
    card("Last 1 day", a.last1day) +
    card("Last 7 days", a.last7days) +
    card("Last 30 days", a.last30days);
}

function renderChapterTable(rows){
  $("#rows-tag").textContent = rows.length + " chapters";
  const max = Math.max(1, ...rows.map(r=>r.players));
  const body = rows.map(r=>{
    const pct = (r.players/max)*100;
    const cls = r.players===0 ? "zero" : "";
    return `<tr>
      <td>${r.chapter}</td>
      <td class="${cls}">${r.range}</td>
      <td class="num barcell">
        <span class="bar" style="width:${pct}%"></span>
        <span class="${cls}">${r.players}</span>
      </td>
    </tr>`;
  }).join("");
  $("#chapter-table tbody").innerHTML = body;
}

function drawChart(rows){
  const canvas = $("#chart");
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = 300;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const padL=36,padR=12,padT=14,padB=64;
  const cw=W-padL-padR, ch=H-padT-padB;
  const max=Math.max(1,...rows.map(r=>r.players));
  ctx.strokeStyle="rgba(244,237,228,.12)"; ctx.fillStyle="rgba(244,237,228,.6)";
  ctx.font="11px system-ui"; ctx.textAlign="right";
  for(let i=0;i<=4;i++){
    const y=padT+ch*(i/4); const val=Math.round(max*(1-i/4));
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(val,padL-6,y+3);
  }
  const n=rows.length, gap=8, bw=Math.max(6,(cw-gap*(n-1))/n);
  rows.forEach((r,i)=>{
    const x=padL+i*(bw+gap), h=ch*(r.players/max), y=padT+ch-h;
    if(r.players>0){
      const g=ctx.createLinearGradient(0,y,0,y+h);
      g.addColorStop(0,"#F2C078"); g.addColorStop(1,"#E4A853");
      ctx.fillStyle=g;
    } else { ctx.fillStyle="rgba(244,237,228,.10)"; }
    ctx.beginPath();
    const rr=Math.min(5,bw/2);
    ctx.roundRect(x,y,bw,Math.max(h,2),[rr,rr,0,0]); ctx.fill();
    // value on top
    if(r.players>0){ ctx.fillStyle="var(--ink)"; ctx.fillStyle="rgba(244,237,228,.9)";
      ctx.textAlign="center"; ctx.fillText(r.players,x+bw/2,y-4); }
    // chapter label (rotated)
    ctx.fillStyle="rgba(244,237,228,.6)"; ctx.textAlign="center";
    ctx.save(); ctx.translate(x+bw/2,H-padB+14); ctx.rotate(-Math.PI/5);
    ctx.fillText(r.chapter,0,0); ctx.restore();
  });
}

async function load(){
  $("#status").innerHTML = `<div class="loading">Loading…</div>`;
  try{
    const res = await fetch(ENDPOINT, { cache:"no-store", credentials:"include" });
    if(!res.ok){ $("#status").innerHTML = `<div class="err">Request failed: ${res.status} ${res.statusText}.</div>`; return; }
    const data = await res.json();
    $("#raw").textContent = JSON.stringify(data,null,2);
    $("#status").innerHTML = "";
    if(data.generatedAt){
      $("#updated").textContent = "Generated " + new Date(data.generatedAt).toLocaleString();
    }
    if(data.totals) renderTotals(data.totals);
    if(data.activePlayers) renderActive(data.activePlayers);
    if(Array.isArray(data.byChapter)){
      renderChapterTable(data.byChapter);
      requestAnimationFrame(()=>drawChart(data.byChapter));
    }
  }catch(err){
    $("#status").innerHTML = `<div class="err">Could not load stats: ${err.message}</div>`;
  }
}

$("#refresh").onclick = load;
$("#auto").onclick = function(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; this.textContent="Auto: off"; this.classList.add("ghost"); }
  else { autoTimer=setInterval(load,30000); this.textContent="Auto: 30s"; this.classList.remove("ghost"); }
};

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const rr=Array.isArray(r)?r:[r,r,r,r];
    this.beginPath(); this.moveTo(x+rr[0],y);
    this.arcTo(x+w,y,x+w,y+h,rr[1]); this.arcTo(x+w,y+h,x,y+h,rr[2]);
    this.arcTo(x,y+h,x,y,rr[3]); this.arcTo(x,y,x+w,y,rr[0]); this.closePath(); return this;
  };
}

window.addEventListener("resize", ()=>{ /* redraw chart on resize */
  const raw=$("#raw").textContent; if(raw&&raw!=="—"){ try{ drawChart(JSON.parse(raw).byChapter);}catch(e){} }
});
load();
</script>
</body>
</html>
